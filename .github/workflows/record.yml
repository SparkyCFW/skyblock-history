name: Record Bazaar prices

on:
  schedule:
    - cron: '17 * * * *'     # every hour at :17 (GitHub may start it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to save the history file

concurrency: record

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Get the current history (from the "data" branch)
        run: |
          git fetch origin data --depth=1 && git show origin/data:bazaar-history.json > bazaar-history.json || echo "No history yet, starting fresh"

      - name: Record this hour's prices
        run: node record.mjs

      - name: Save to the "data" branch (replaced each time, so the repo stays small)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && mv bazaar-history.json out/
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bazaar-history.json
          git commit -q -m "Bazaar history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
